<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Huzur - Gün 3: Zikir & Tesbih</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    background: linear-gradient(180deg, #1a0a2e 0%, #2d1b4e 30%, #150826 100%);
    position: relative;
  }

  /* Stars */
  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out;
  }
  .star:nth-child(1) { left: 8%; top: 5%; animation-delay: 0s; }
  .star:nth-child(2) { left: 92%; top: 8%; animation-delay: 0.5s; width: 4px; height: 4px; }
  .star:nth-child(3) { left: 45%; top: 3%; animation-delay: 1s; }
  .star:nth-child(4) { left: 70%; top: 12%; animation-delay: 1.5s; width: 2px; height: 2px; }
  .star:nth-child(5) { left: 20%; top: 15%; animation-delay: 2s; }
  .star:nth-child(6) { left: 85%; top: 25%; animation-delay: 0.7s; width: 2px; height: 2px; }
  .star:nth-child(7) { left: 55%; top: 10%; animation-delay: 1.2s; }
  .star:nth-child(8) { left: 35%; top: 18%; animation-delay: 2.3s; width: 4px; height: 4px; }
  .star:nth-child(9) { left: 15%; top: 30%; animation-delay: 0.3s; }
  .star:nth-child(10) { left: 75%; top: 20%; animation-delay: 1.8s; }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
  }

  /* Crescent moon */
  .moon {
    position: absolute;
    top: 50px;
    right: 100px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    box-shadow: -15px -5px 0 0 #f4d03f;
    opacity: 0;
    animation: moonRise 1.5s 0.3s forwards;
  }

  @keyframes moonRise {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 0.8; transform: translateY(0); }
  }

  .pattern-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 0%, rgba(180, 130, 255, 0.06) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Hook */
  .hook {
    position: absolute;
    top: 120px;
    left: 0;
    width: 100%;
    text-align: center;
    opacity: 0;
    animation: fadeSlideDown 1s 0.5s forwards;
  }

  .hook-text {
    font-size: 52px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    line-height: 1.3;
    padding: 0 60px;
  }

  .hook-emoji {
    font-size: 72px;
    display: block;
    margin-bottom: 20px;
    animation: beadSway 2s infinite ease-in-out;
  }

  @keyframes beadSway {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  /* Phone mockup */
  .phone-container {
    position: absolute;
    top: 380px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    animation: phoneSlideUp 1.2s 1.5s forwards;
  }

  .phone-frame {
    width: 520px;
    height: 1060px;
    background: #000;
    border-radius: 50px;
    padding: 12px;
    box-shadow: 
      0 30px 80px rgba(0,0,0,0.5),
      0 0 0 2px rgba(180, 130, 255, 0.2),
      inset 0 0 0 1px rgba(255,255,255,0.1);
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 40px;
    overflow: hidden;
    background: #fff;
  }

  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .phone-glow {
    position: absolute;
    top: -20px;
    left: -20px;
    right: -20px;
    bottom: -20px;
    border-radius: 60px;
    background: radial-gradient(ellipse, rgba(180, 130, 255, 0.12) 0%, transparent 70%);
    z-index: -1;
    animation: glowPulse 3s infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* Feature Tags */
  .feature-tag {
    position: absolute;
    padding: 12px 24px;
    background: rgba(180, 130, 255, 0.12);
    border: 1px solid rgba(180, 130, 255, 0.25);
    border-radius: 30px;
    color: #c9a0ff;
    font-size: 24px;
    font-weight: 600;
    opacity: 0;
    backdrop-filter: blur(10px);
  }

  .tag-1 { right: 40px; top: 520px; animation: fadeIn 0.8s 2.5s forwards; }
  .tag-2 { left: 40px; top: 700px; animation: fadeIn 0.8s 2.8s forwards; }
  .tag-3 { right: 60px; top: 870px; animation: fadeIn 0.8s 3.1s forwards; }

  /* Rotating prayer beads circle */
  .beads-circle {
    position: absolute;
    top: 300px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 120px;
    border: 2px dashed rgba(180, 130, 255, 0.2);
    border-radius: 50%;
    animation: rotateBeads 20s linear infinite;
    opacity: 0;
  }

  @keyframes rotateBeads {
    from { transform: translateX(-50%) rotate(0deg); }
    to { transform: translateX(-50%) rotate(360deg); }
  }

  /* CTA */
  .cta-section {
    position: absolute;
    bottom: 100px;
    left: 0;
    width: 100%;
    text-align: center;
    opacity: 0;
    animation: fadeSlideUp 1s 3s forwards;
  }

  .app-name {
    font-size: 64px;
    font-weight: 800;
    background: linear-gradient(135deg, #c9a0ff, #e0c3ff, #c9a0ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 4px;
    margin-bottom: 10px;
  }

  .cta-text {
    font-size: 36px;
    color: rgba(255,255,255,0.85);
    font-weight: 600;
    margin-bottom: 30px;
  }

  .cta-badge {
    display: inline-block;
    padding: 16px 48px;
    background: linear-gradient(135deg, #8b5cf6, #7c3aed);
    border-radius: 50px;
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    animation: badgePulse 2s 4s infinite;
  }

  @keyframes badgePulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(180,130,255,0.4); }
    50% { transform: scale(1.05); box-shadow: 0 0 30px 10px rgba(180,130,255,0.2); }
  }

  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes phoneSlideUp {
    from { opacity: 0; transform: translateX(-50%) translateY(60px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <!-- Stars -->
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>
  <div class="star"></div>

  <div class="moon"></div>
  <div class="pattern-overlay"></div>

  <!-- Hook -->
  <div class="hook">
    <span class="hook-emoji">📿</span>
    <div class="hook-text">Gün içinde kaç kere<br>zikir çekiyorsun?</div>
  </div>

  <!-- Phone Mockup -->
  <div class="phone-container">
    <div class="phone-glow"></div>
    <div class="phone-frame">
      <div class="phone-screen">
        <img src="../mockups/day3-zikir.png" alt="Huzur App - Zikir & Tesbih">
      </div>
    </div>
  </div>

  <!-- Feature Tags -->
  <div class="feature-tag tag-1">📿 Dijital zikirmatik</div>
  <div class="feature-tag tag-2">🎯 Günlük hedef</div>
  <div class="feature-tag tag-3">🌙 Manevi gelişim</div>

  <!-- CTA -->
  <div class="cta-section">
    <div class="app-name">HUZUR</div>
    <div class="cta-text">Zikrini unutma, huzuru bul</div>
    <div class="cta-badge">📲 Hemen İndir</div>
  </div>
</body>
</html>
