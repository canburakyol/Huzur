<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Huzur - Gün 2: Kuran-ı Kerim</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    background: linear-gradient(180deg, #0a1628 0%, #1a3a5c 30%, #0d2040 100%);
    position: relative;
  }

  /* Ambient particles - blue theme */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: rgba(100, 180, 255, 0.3);
    border-radius: 50%;
    animation: float 8s infinite ease-in-out;
  }
  .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
  .particle:nth-child(2) { left: 80%; top: 15%; animation-delay: 1s; width: 6px; height: 6px; }
  .particle:nth-child(3) { left: 50%; top: 40%; animation-delay: 2s; }
  .particle:nth-child(4) { left: 25%; top: 60%; animation-delay: 3s; width: 5px; height: 5px; }
  .particle:nth-child(5) { left: 70%; top: 70%; animation-delay: 4s; }
  .particle:nth-child(6) { left: 40%; top: 85%; animation-delay: 5s; width: 3px; height: 3px; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
    50% { transform: translateY(-30px) scale(1.5); opacity: 0.7; }
  }

  .pattern-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 0%, rgba(100, 180, 255, 0.06) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Hook */
  .hook {
    position: absolute;
    top: 120px;
    left: 0;
    width: 100%;
    text-align: center;
    opacity: 0;
    animation: fadeSlideDown 1s 0.5s forwards;
  }

  .hook-text {
    font-size: 50px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    line-height: 1.3;
    padding: 0 60px;
  }

  .hook-emoji {
    font-size: 72px;
    display: block;
    margin-bottom: 20px;
    animation: bookOpen 2s infinite;
  }

  @keyframes bookOpen {
    0%, 100% { transform: scale(1) rotateY(0deg); }
    50% { transform: scale(1.1) rotateY(10deg); }
  }

  /* Phone mockup */
  .phone-container {
    position: absolute;
    top: 380px;
    left: 50%;
    transform: translateX(-50%) perspective(1000px) rotateY(3deg);
    opacity: 0;
    animation: phoneSlideUp 1.2s 1.5s forwards;
  }

  .phone-frame {
    width: 520px;
    height: 1060px;
    background: #000;
    border-radius: 50px;
    padding: 12px;
    box-shadow: 
      0 30px 80px rgba(0,0,0,0.5),
      0 0 0 2px rgba(100, 180, 255, 0.2),
      inset 0 0 0 1px rgba(255,255,255,0.1);
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 40px;
    overflow: hidden;
    background: #fff;
  }

  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .phone-glow {
    position: absolute;
    top: -20px;
    left: -20px;
    right: -20px;
    bottom: -20px;
    border-radius: 60px;
    background: radial-gradient(ellipse, rgba(100, 180, 255, 0.12) 0%, transparent 70%);
    z-index: -1;
    animation: glowPulse 3s infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* Ayah highlight - animated verse display */
  .verse-highlight {
    position: absolute;
    top: 320px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 38px;
    color: rgba(100, 180, 255, 0.6);
    font-style: italic;
    text-align: center;
    opacity: 0;
    animation: verseFade 1s 1s forwards;
    direction: rtl;
    font-family: serif;
  }

  @keyframes verseFade {
    from { opacity: 0; }
    to { opacity: 0.5; }
  }

  /* Feature Tags */
  .feature-tag {
    position: absolute;
    padding: 12px 24px;
    background: rgba(100, 180, 255, 0.12);
    border: 1px solid rgba(100, 180, 255, 0.25);
    border-radius: 30px;
    color: #7cb8ff;
    font-size: 24px;
    font-weight: 600;
    opacity: 0;
    backdrop-filter: blur(10px);
  }

  .tag-1 { left: 40px; top: 530px; animation: fadeIn 0.8s 2.5s forwards; }
  .tag-2 { right: 40px; top: 700px; animation: fadeIn 0.8s 2.8s forwards; }
  .tag-3 { left: 60px; top: 870px; animation: fadeIn 0.8s 3.1s forwards; }

  /* CTA */
  .cta-section {
    position: absolute;
    bottom: 100px;
    left: 0;
    width: 100%;
    text-align: center;
    opacity: 0;
    animation: fadeSlideUp 1s 3s forwards;
  }

  .app-name {
    font-size: 64px;
    font-weight: 800;
    background: linear-gradient(135deg, #7cb8ff, #a8d4ff, #7cb8ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 4px;
    margin-bottom: 10px;
  }

  .cta-text {
    font-size: 36px;
    color: rgba(255,255,255,0.85);
    font-weight: 600;
    margin-bottom: 30px;
  }

  .cta-badge {
    display: inline-block;
    padding: 16px 48px;
    background: linear-gradient(135deg, #4a90d9, #357abd);
    border-radius: 50px;
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    animation: badgePulse 2s 4s infinite;
  }

  @keyframes badgePulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(100,180,255,0.4); }
    50% { transform: scale(1.05); box-shadow: 0 0 30px 10px rgba(100,180,255,0.2); }
  }

  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes phoneSlideUp {
    from { opacity: 0; transform: translateX(-50%) perspective(1000px) rotateY(3deg) translateY(60px); }
    to { opacity: 1; transform: translateX(-50%) perspective(1000px) rotateY(3deg) translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="pattern-overlay"></div>

  <!-- Hook -->
  <div class="hook">
    <span class="hook-emoji">📖</span>
    <div class="hook-text">Kuran okuyorsun ama<br>mealini bilmiyor musun?</div>
  </div>

  <!-- Phone Mockup -->
  <div class="phone-container">
    <div class="phone-glow"></div>
    <div class="phone-frame">
      <div class="phone-screen">
        <img src="../mockups/day2-kuran.png" alt="Huzur App - Kuran-ı Kerim">
      </div>
    </div>
  </div>

  <!-- Feature Tags -->
  <div class="feature-tag tag-1">📖 Ayet ayet meal</div>
  <div class="feature-tag tag-2">🔊 Sesli okuma</div>
  <div class="feature-tag tag-3">📊 Hatim takibi</div>

  <!-- CTA -->
  <div class="cta-section">
    <div class="app-name">HUZUR</div>
    <div class="cta-text">Kuran'ı anlayarak oku</div>
    <div class="cta-badge">📲 Hemen İndir</div>
  </div>
</body>
</html>
