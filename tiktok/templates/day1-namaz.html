<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Huzur - Gün 1: Namaz Vakitleri</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    background: linear-gradient(180deg, #0d2818 0%, #1a4d2e 30%, #0d2818 100%);
    position: relative;
  }

  /* Ambient particles */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: rgba(212, 175, 55, 0.3);
    border-radius: 50%;
    animation: float 8s infinite ease-in-out;
  }
  .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
  .particle:nth-child(2) { left: 80%; top: 15%; animation-delay: 1s; width: 6px; height: 6px; }
  .particle:nth-child(3) { left: 50%; top: 40%; animation-delay: 2s; }
  .particle:nth-child(4) { left: 25%; top: 60%; animation-delay: 3s; width: 5px; height: 5px; }
  .particle:nth-child(5) { left: 70%; top: 70%; animation-delay: 4s; }
  .particle:nth-child(6) { left: 40%; top: 85%; animation-delay: 5s; width: 3px; height: 3px; }
  .particle:nth-child(7) { left: 90%; top: 50%; animation-delay: 2.5s; }
  .particle:nth-child(8) { left: 15%; top: 80%; animation-delay: 3.5s; width: 7px; height: 7px; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
    50% { transform: translateY(-30px) scale(1.5); opacity: 0.7; }
  }

  /* Geometric Islamic pattern overlay */
  .pattern-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Hook Text - appears first */
  .hook {
    position: absolute;
    top: 120px;
    left: 0;
    width: 100%;
    text-align: center;
    opacity: 0;
    animation: fadeSlideDown 1s 0.5s forwards;
  }

  .hook-text {
    font-size: 52px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    line-height: 1.3;
    padding: 0 60px;
  }

  .hook-emoji {
    font-size: 72px;
    display: block;
    margin-bottom: 20px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* Phone mockup */
  .phone-container {
    position: absolute;
    top: 380px;
    left: 50%;
    transform: translateX(-50%) perspective(1000px) rotateY(-5deg);
    opacity: 0;
    animation: phoneSlideUp 1.2s 1.5s forwards;
  }

  .phone-frame {
    width: 520px;
    height: 1060px;
    background: #000;
    border-radius: 50px;
    padding: 12px;
    box-shadow: 
      0 30px 80px rgba(0,0,0,0.5),
      0 0 0 2px rgba(212, 175, 55, 0.3),
      inset 0 0 0 1px rgba(255,255,255,0.1);
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 40px;
    overflow: hidden;
    background: #fff;
  }

  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Glow effect around phone */
  .phone-glow {
    position: absolute;
    top: -20px;
    left: -20px;
    right: -20px;
    bottom: -20px;
    border-radius: 60px;
    background: radial-gradient(ellipse, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
    z-index: -1;
    animation: glowPulse 3s infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* Bottom CTA section */
  .cta-section {
    position: absolute;
    bottom: 100px;
    left: 0;
    width: 100%;
    text-align: center;
    opacity: 0;
    animation: fadeSlideUp 1s 3s forwards;
  }

  .app-name {
    font-size: 64px;
    font-weight: 800;
    background: linear-gradient(135deg, #d4af37, #f4d03f, #d4af37);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 4px;
    margin-bottom: 10px;
  }

  .cta-text {
    font-size: 36px;
    color: rgba(255,255,255,0.85);
    font-weight: 600;
    margin-bottom: 30px;
  }

  .cta-badge {
    display: inline-block;
    padding: 16px 48px;
    background: linear-gradient(135deg, #d4af37, #b8962e);
    border-radius: 50px;
    font-size: 32px;
    font-weight: 700;
    color: #0d2818;
    letter-spacing: 1px;
    animation: badgePulse 2s 4s infinite;
  }

  @keyframes badgePulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212,175,55,0.4); }
    50% { transform: scale(1.05); box-shadow: 0 0 30px 10px rgba(212,175,55,0.2); }
  }

  /* Feature highlights floating */
  .feature-tag {
    position: absolute;
    padding: 12px 24px;
    background: rgba(212, 175, 55, 0.15);
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 30px;
    color: #d4af37;
    font-size: 24px;
    font-weight: 600;
    opacity: 0;
    backdrop-filter: blur(10px);
  }

  .tag-1 { right: 40px; top: 520px; animation: fadeIn 0.8s 2.5s forwards; }
  .tag-2 { left: 40px; top: 680px; animation: fadeIn 0.8s 2.8s forwards; }
  .tag-3 { right: 60px; top: 850px; animation: fadeIn 0.8s 3.1s forwards; }

  /* Animations */
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes phoneSlideUp {
    from { opacity: 0; transform: translateX(-50%) perspective(1000px) rotateY(-5deg) translateY(60px); }
    to { opacity: 1; transform: translateX(-50%) perspective(1000px) rotateY(-5deg) translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Mosque silhouette at bottom */
  .mosque-silhouette {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 200px;
    background: linear-gradient(to top, rgba(0,0,0,0.3), transparent);
    pointer-events: none;
  }
</style>
</head>
<body>
  <!-- Ambient particles -->
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="pattern-overlay"></div>

  <!-- Hook -->
  <div class="hook">
    <span class="hook-emoji">⏰</span>
    <div class="hook-text">Her gün kaç vakit<br>namazı kaçırıyorsun?</div>
  </div>

  <!-- Phone Mockup -->
  <div class="phone-container">
    <div class="phone-glow"></div>
    <div class="phone-frame">
      <div class="phone-screen">
        <img src="../mockups/day1-namaz.png" alt="Huzur App - Namaz Vakitleri">
      </div>
    </div>
  </div>

  <!-- Feature Tags -->
  <div class="feature-tag tag-1">🕌 Konum bazlı vakitler</div>
  <div class="feature-tag tag-2">🤲 Günün duası</div>
  <div class="feature-tag tag-3">📿 İbadet takibi</div>

  <!-- Bottom CTA -->
  <div class="cta-section">
    <div class="app-name">HUZUR</div>
    <div class="cta-text">Namazını takip et, huzuru yakala</div>
    <div class="cta-badge">📲 Hemen İndir</div>
  </div>

  <div class="mosque-silhouette"></div>
</body>
</html>
