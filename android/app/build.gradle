apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.firebase.crashlytics'

def releaseKeystoreProps = new Properties()
def releaseKeystorePropsFile = rootProject.file('keystore.properties')
if (releaseKeystorePropsFile.exists()) {
    releaseKeystorePropsFile.withInputStream { stream ->
        releaseKeystoreProps.load(stream)
    }
}

def readReleaseSigningValue = { String propertyKey, String envKey ->
    def propertyValue = releaseKeystoreProps.getProperty(propertyKey)
    if (propertyValue != null && propertyValue.toString().trim()) {
        return propertyValue.toString().trim()
    }
    def envValue = System.getenv(envKey)
    return envValue != null && envValue.toString().trim() ? envValue.toString().trim() : null
}

def releaseStoreFile = readReleaseSigningValue('storeFile', 'HUZUR_UPLOAD_STORE_FILE')
def releaseStorePassword = readReleaseSigningValue('storePassword', 'HUZUR_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = readReleaseSigningValue('keyAlias', 'HUZUR_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = readReleaseSigningValue('keyPassword', 'HUZUR_UPLOAD_KEY_PASSWORD')
def hasReleaseSigningConfig = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { value ->
    value != null && value.toString().trim()
}

android {
    namespace "com.huzurapp.android"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.huzurapp.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 29
        versionName "18.2.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['en', 'tr', 'id', 'de']
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds true
        abortOnError true
    }
    buildFeatures {
        buildConfig = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase BoM keeps messaging and App Check versions aligned.
    implementation platform('com.google.firebase:firebase-bom:34.8.0')

    // Firebase Cloud Messaging - Push Notifications
    implementation 'com.google.firebase:firebase-messaging'

    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Google Mobile Ads SDK (banner + rewarded)
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    // Play Store install referrer for post-install referral attribution
    implementation 'com.android.installreferrer:installreferrer:2.2'

    // WorkManager for background prayer data sync
    implementation 'androidx.work:work-runtime-ktx:2.10.1'

    // Kotlin Coroutines for CoroutineWorker
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
